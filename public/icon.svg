<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Ambient Glow effect -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#glow)" opacity="0.4" />

  <!-- Command Terminal / Prompt Slash Icon -->
  <g transform="translate(48, 48) scale(0.8125)">
    <!-- Terminal Prompt Chevron `>` -->
    <path d="M 120 160 L 220 256 L 120 352" fill="none" stroke="url(#accentGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Prompt Slash `/` -->
    <path d="M 280 130 L 210 382" fill="none" stroke="#38bdf8" stroke-width="32" stroke-linecap="round" />

    <!-- AI Sparkle / Magic Star -->
    <path d="M 360 140 Q 360 200 420 200 Q 360 200 360 260 Q 360 200 300 200 Q 360 200 360 140 Z" fill="url(#accentGrad)" filter="url(#glow)" />
    <circle cx="360" cy="200" r="12" fill="#ffffff" />

    <!-- Underscore Cursor `_` -->
    <line x1="280" y1="360" x2="380" y2="360" stroke="#a855f7" stroke-width="32" stroke-linecap="round" />
  </g>
</svg>
